# Builds the whole toolchain for the three desktops and packages it.
#
# An hour or more per platform -- binutils, gdb, gcc and newlib are all
# built from source, and gdb's own clone is 600 MB -- so this does not
# run on every push: start it by hand from the Actions tab, or push a
# tag.
#
# macOS and Windows get the built toolchain: the same tree the repository
# itself is a toolchain in (gcc/bin, gcc/xgcc, debugger/bin, rom,
# resources), so everything that finds its own way around -- the ld-ppu
# wrapper, uknc-run, the editor extension -- keeps working unpacked.
# Linux builds all of that too, and then packages the repository
# instead: there the build is the check, not the product.
name: Toolchain

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which to build, space separated: linux macos macos-intel windows'
        default: 'linux macos macos-intel windows'
  push:
    tags:
      - 'v*'

jobs:
  # Which platforms this run is for.  A tag builds all four; by hand,
  # one can be asked for on its own, which is worth having when the
  # thing being fixed is that one's own build and the others take an
  # hour each to tell you nothing new.
  choose:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          wanted='${{ inputs.platforms || 'linux macos macos-intel windows' }}'
          # macos-15-intel is the last x86_64 image Actions offers:
          # macos-13 was retired in December 2025, and asking for it
          # leaves a job queued for ever rather than failing outright,
          # and this one goes away itself in 2027.
          all='[
            {"key":"linux",  "name":"Linux",  "os":"ubuntu-latest",
             "platform":"linux-x86_64",   "shell":"bash"},
            {"key":"macos",  "name":"macOS",  "os":"macos-latest",
             "platform":"macos-arm64",    "shell":"bash"},
            {"key":"macos-intel","name":"macOS (Intel)","os":"macos-15-intel",
             "platform":"macos-x86_64",   "shell":"bash"},
            {"key":"windows","name":"Windows","os":"windows-latest",
             "platform":"windows-x86_64", "shell":"msys2 {0}"}
          ]'
          # The names are passed as arguments rather than as one string
          # so that jq does the matching against a list it was given:
          # inside index(), "." is that list and not the entry.
          matrix=$(echo "${all}" \
            | jq -c '[.[] | select(.key as $k | $ARGS.positional | index($k))]' \
                 --args ${wanted})
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}" | jq .

  build:
    needs: choose
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.choose.outputs.matrix) }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v5

      # What the build needs that a runner does not already have. gdb is
      # the demanding one: it is built from a git clone rather than a
      # release, so its parsers are generated here (bison, flex), and it
      # does target arithmetic with GMP and MPFR.
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # python3-dev rather than python3: gdb links against Python,
          # and libs/libppu/ppu.gdb is how the PPU side gets its symbols.
          # Without the headers and the library, gdb's configure switches
          # Python off and says so only in its own config.log.  The runner
          # image happens to have them; a bare container would not.
          sudo apt-get install -y --no-install-recommends \
            build-essential texinfo bison flex libtool python3-dev \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev
          # The emulator's window is optional -- see util/Screen.cpp --
          # and SDL3 is young enough not to be everywhere yet.
          sudo apt-get install -y libsdl3-dev \
            || echo "no SDL3 here: the emulator will have no screen"

      # Signing, where there is something to sign with.  Everything in
      # the package is signed either way: a program whose load commands
      # have been rewritten has a broken signature, and on Apple Silicon
      # that is a program the kernel kills outright.  With no
      # certificate that signature is ad-hoc -- enough to run where it
      # was built, not enough for Gatekeeper on a downloaded image.
      #
      # The keychain dance is the one from GitHub's own documentation,
      # "Installing an Apple certificate on macOS runners for Xcode
      # development", command for command.  No provisioning profile:
      # that part of their example is for app targets submitted to the
      # store, and this is Developer ID distribution of command line
      # tools.  No clean-up step either -- their page says a
      # GitHub-hosted runner is a virtual machine destroyed at the end
      # of the job, and only a self-hosted one needs the keychain
      # deleting afterwards.
      #
      # Secrets.  The first two are enough to sign; add a set of notary
      # credentials and the image is notarised and stapled as well,
      # which is what Gatekeeper actually asks for on a download:
      #
      #   MACOS_CERTIFICATE           base64 of a "Developer ID
      #                               Application" .p12
      #   MACOS_CERTIFICATE_PASSWORD  the password it was exported with
      #
      #   either an App Store Connect API key --
      #   MACOS_NOTARY_KEY            base64 of the .p8
      #   MACOS_NOTARY_KEY_ID         its key id
      #   MACOS_NOTARY_ISSUER         issuer uuid; Apple's own tool says
      #                               this is for team keys and must be
      #                               left out for individual ones, so
      #                               an empty secret is honoured
      #
      #   or an Apple ID --
      #   MACOS_NOTARY_APPLE_ID       the developer Apple ID
      #   MACOS_NOTARY_PASSWORD       an app-specific password for it
      #   MACOS_NOTARY_TEAM_ID        the team id
      #
      # Nothing here fails when they are absent.
      - name: Signing identity (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${CERTIFICATE}" ]; then
            echo "no MACOS_CERTIFICATE: signing ad-hoc, as before"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          CERTIFICATE_PATH="${RUNNER_TEMP}/certificate.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          # Any new random string, the keychain being created here and
          # destroyed with the machine -- so it is not a secret of its
          # own to keep.
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo -n "${CERTIFICATE}" | base64 --decode -o "${CERTIFICATE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          security import "${CERTIFICATE_PATH}" \
            -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          # Without this codesign stops to ask for the keychain password,
          # and a build nobody is sitting at waits for ever.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}" > /dev/null
          security list-keychain -d user -s "${KEYCHAIN_PATH}"
          rm -f "${CERTIFICATE_PATH}"

          # It has to be a Developer ID one.  Apple's notarization notes
          # are explicit that a Mac Distribution, ad hoc, Apple
          # Developer or local development certificate will not do, and
          # the failure if the wrong one is used comes an hour later from
          # the notary service rather than here.
          identity=$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "${identity}" ]; then
            echo "MACOS_CERTIFICATE is not a Developer ID Application" \
                 "certificate; what it holds:" >&2
            security find-identity -v -p codesigning "${KEYCHAIN_PATH}" >&2
            exit 1
          fi
          echo "signing as ${identity}"
          echo "SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"
          # What notarization requires of every executable: the hardened
          # runtime and a secure timestamp.  The timestamp needs the
          # network -- it comes from timestamp.apple.com -- so it can
          # fail quietly; the check before notarising looks for it.
          echo "SIGN_FLAGS=--options runtime --timestamp" >> "$GITHUB_ENV"

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp mpfr libmpc bison flex sdl3
          # Apple's own bison is from 2006 and gdb's parsers need a
          # newer one; Homebrew keeps it out of the way on purpose.
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make patch curl tar diffutils texinfo bison flex perl
            autoconf automake libtool
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-mpc
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-pkgconf

      # Separately, and allowed to fail: the emulator's window is
      # optional (see util/Screen.cpp) and SDL3 is young enough that not
      # every package set has it yet.
      - name: SDL3 (Windows)
        if: runner.os == 'Windows'
        run: |
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-sdl3 \
            || echo "no SDL3 here: the emulator will have no screen"

      # Keyed by platform rather than by runner.os: the two macOS jobs
      # differ only in their architecture, and under one key the Intel
      # one would happily restore the Apple Silicon toolchain and
      # package it.
      #
      # Worked out here, before anything is built, and used by both the
      # restore and the save below.  hashFiles reads the tree as it is
      # when the step runs, and building the toolchain writes into libs/
      # (libppu.a and its objects) -- so a key computed at save time was
      # a key no fresh checkout could ever match, and every run rebuilt
      # everything and cached it for nobody.
      - name: What to call the cached toolchain
        run: |
          echo "toolchainkey=toolchain-${{ matrix.platform }}-${{ hashFiles('gcc/build_gcc_uknc.sh', 'libs/**') }}" \
            >> "$GITHUB_ENV"

      # Forty minutes of binutils, gdb, gcc and newlib that only change
      # when the script that builds them does.  Anything else being
      # fixed -- the emulator, the packaging, this file -- gets them
      # back in thirty seconds instead.
      - name: The toolchain from last time
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gcc/bin
            gcc/xgcc
          key: ${{ env.toolchainkey }}

      - name: Build the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd gcc && sh ./build_gcc_uknc.sh

      # Saved here rather than at the end of the job, because the whole
      # point is the next attempt at whatever comes after: a job that
      # fails further on would otherwise throw away the forty minutes it
      # got right.
      - name: Keep the toolchain for next time
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gcc/bin
            gcc/xgcc
          key: ${{ env.toolchainkey }}

      - name: Build the emulator
        run: cd debugger && sh ./build_debugger_uknc.sh

      # The toolchain builds a program, the machine runs it, and the
      # program says so itself -- which is every piece of this working at
      # once, and takes six seconds.
      - name: Run a program on the machine
        run: |
          export PATH="${PWD}/gcc/bin:${PATH}"
          make -C examples/hello hello.sav
          ./gcc/dejagnu/uknc-run examples/hello/hello.sav

      # The version is the VERSION file's, and only a tagged build is
      # called that plainly: anything else is some commit between two of
      # them and says which.
      - name: What this build is called
        run: |
          version="$(cat VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # The file is where the version lives; the tag only says
            # which commit of it is being released.  Two answers to the
            # same question is one too many.
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "tag ${GITHUB_REF_NAME} but VERSION says ${version}" >&2
              exit 1
            fi
          else
            version="${version}+$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_ENV"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            echo "name=uknc-${version}-src" >> "$GITHUB_ENV"
          else
            echo "name=uknc-toolchain-${version}-${{ matrix.platform }}" \
              >> "$GITHUB_ENV"
          fi

      # The package is a toolchain root, laid out exactly as this
      # repository is one. Sources, build trees and the git checkout stay
      # behind; nothing else is rearranged.
      - name: Lay out the package
        if: runner.os != 'Linux'
        run: |
          mkdir -p "dist/${name}"
          cd "dist/${name}"
          mkdir -p gcc debugger
          cp -R "${GITHUB_WORKSPACE}/gcc/bin" gcc/
          cp -R "${GITHUB_WORKSPACE}/gcc/xgcc" gcc/
          cp -R "${GITHUB_WORKSPACE}/gcc/dejagnu" gcc/
          cp -R "${GITHUB_WORKSPACE}/debugger/bin" debugger/
          cp -R "${GITHUB_WORKSPACE}/rom" .
          cp -R "${GITHUB_WORKSPACE}/resources" .
          cp -R "${GITHUB_WORKSPACE}/examples" .
          cp -R "${GITHUB_WORKSPACE}/libs" .
          # The CMake toolchain file finds the rest of the package by
          # sitting in it, so it has to come along.
          cp -R "${GITHUB_WORKSPACE}/cmake" .
          cp "${GITHUB_WORKSPACE}/README.md" .
          # What this package actually contains, for anyone holding the
          # binary a year from now with no idea what went into it.
          {
            echo "uknc-toolchain ${version} (${{ matrix.platform }})"
            echo "built $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA}"
            echo
            grep -E '^(BINUTILS|GCC|NEWLIB)_VERSION=' \
              "${GITHUB_WORKSPACE}/gcc/build_gcc_uknc.sh"
          } > VERSION.txt
          # The examples were built a moment ago to check the toolchain,
          # and what that left behind is not part of it.  Only there,
          # and only those: the toolchain's own object files are the
          # ones every link needs -- crt0rt.o and parse_args.o sit in
          # lib/gcc, and deleting them left a compiler that could not
          # link a program at all.
          find examples \( -name '*.o' -o -name '*.sav' -o -name '*.elf' \
                        -o -name '*.map' -o -name '*.dsk' -o -name '*.ppu' \) \
               -delete

          # Every one of these is built with the -g -O2 its own configure
          # defaults to, and what that leaves in gcc, gdb and cc1 is
          # hundreds of megabytes of debug information about the
          # compiler, for people who are not debugging the compiler. The
          # first package came to 567 MB.
          #
          # Host programs only -- the archives under gcc/xgcc are for the
          # machine, and their debug information is the whole point of
          # CFLAGS_FOR_TARGET carrying -g (it is what lets gdb step
          # through newlib). Scripts and anything else strip cannot read
          # are stepped over.
          if [ "${RUNNER_OS}" = "macOS" ]; then
            find . -type f -perm -u+x -exec strip -x {} + 2>/dev/null || true
          else
            find . -type f -perm -u+x -exec strip {} + 2>/dev/null || true
          fi
          du -sh . | sed 's/^/package: /'

      # Everything the package needs that the machine it lands on might
      # not have.  Here that is Homebrew's and MSYS2's: SDL3 for the
      # emulator, GMP, MPFR and zstd for gdb.  Left out, the package
      # works perfectly on the machine that built it and dies on the
      # first one that never installed them -- which is not a theory:
      # gdb here stopped starting the day a package manager was tidied
      # away underneath it.
      - name: Take the libraries with it
        if: runner.os == 'macOS'
        run: |
          # Ad-hoc when there is no certificate, and then a failure means
          # only that the file was not a Mach-O one after all; with a
          # certificate a failure is a failure.
          sign () {
            if [ "${SIGN_IDENTITY}" = "-" ]; then
              codesign -f -s - "$1" 2>/dev/null || true
            else
              codesign -f -s "${SIGN_IDENTITY}" ${SIGN_FLAGS} "$1"
            fi
          }

          cd "dist/${name}"
          mkdir -p lib

          # Every program in the package, and everything it asks for
          # that is not part of the system.  Copied once into lib/ and
          # renamed to @rpath, which each program then looks for beside
          # itself -- and the copies are put through the same treatment,
          # since a library has libraries of its own (MPFR wants GMP).
          # Nothing left after the filtering is the answer being looked
          # for here, not a failure -- and grep says otherwise, which
          # under "set -e -o pipefail" ends the step where it stands.
          collect () {
            otool -L "$1" | tail -n +2 | awk '{print $1}' \
              | grep -vE '^/usr/lib/|^/System/|^@' || true
          }

          again=yes
          while [ "${again}" = yes ]; do
            again=no
            for binary in $(find . -type f -perm -u+x) lib/*.dylib; do
              [ -f "${binary}" ] || continue
              for dep in $(collect "${binary}"); do
                base=$(basename "${dep}")
                if [ ! -f "lib/${base}" ]; then
                  cp "${dep}" "lib/${base}"
                  chmod u+w "lib/${base}"
                  install_name_tool -id "@rpath/${base}" "lib/${base}"
                  again=yes
                fi
                install_name_tool -change "${dep}" "@rpath/${base}" \
                  "${binary}"
              done
            done
          done

          # Where @rpath is, from wherever the program sits.
          for binary in $(find . -type f -perm -u+x); do
            case "$(file -b "${binary}")" in
              *Mach-O*) ;;
              *) continue ;;
            esac
            depth=$(dirname "${binary}" | awk -F/ '{print NF - 1}')
            up=""
            i=0
            while [ ${i} -lt ${depth} ]; do up="${up}../"; i=$((i + 1)); done
            install_name_tool -add_rpath "@loader_path/${up}lib" \
              "${binary}" 2>/dev/null || true
            # Rewriting a program breaks its signature, and on Apple
            # Silicon a broken signature is a program that will not run
            # at all -- killed outright, with nothing said.  With a
            # certificate this is also the real signature the image is
            # notarised on, so there it has to succeed rather than be
            # tried: a package half of which is signed is worse than one
            # that is not.
            sign "${binary}"
          done
          for library in lib/*.dylib; do
            [ -f "${library}" ] && sign "${library}"
          done

          echo "still wanted from outside:"
          for binary in $(find . -type f -perm -u+x); do
            collect "${binary}" | sed "s|^|  ${binary}: |"
          done | tee outside.txt
          if [ -s outside.txt ]; then
            echo "a package that needs what is not in it" >&2
            exit 1
          fi
          rm -f outside.txt

      - name: Take the libraries with it
        if: runner.os == 'Windows'
        run: |
          cd "dist/${name}"
          # ldd lists what a program loads, with the paths it will load
          # them from; everything under the package set's own prefix has
          # to come along, beside the program that wants it (which is
          # where Windows looks first).
          for exe in $(find . -name '*.exe'); do
            for dll in $(ldd "${exe}" | awk '{print $3}' \
                         | grep -i '^/ucrt64/'); do
              cp -n "${dll}" "$(dirname "${exe}")/" || true
            done
          done

          echo "still wanted from outside:"
          left=""
          for exe in $(find . -name '*.exe'); do
            missing=$(ldd "${exe}" | awk '{print $3}' | grep -i '^/ucrt64/' \
                      || true)
            if [ -n "${missing}" ]; then
              echo "  ${exe}: ${missing}"
              left=yes
            fi
          done
          if [ -n "${left}" ]; then
            echo "a package that needs what is not in it" >&2
            exit 1
          fi

      # The same program again, with the package this time: its own
      # compiler, its own libraries, its own emulator, nothing on the
      # machine outside the folder.  Building a package and shipping a
      # package that works are two different claims, and the first
      # release proved it -- everything above was green and the thing
      # inside the dmg could not link hello.c.
      - name: Run a program with the package
        if: runner.os != 'Linux'
        run: |
          cd "dist/${name}"
          export PATH="${PWD}/gcc/bin:${PATH}"
          cp examples/hello/hello.c check.c
          pdp11-uknc-rt11-gcc -std=gnu23 -O2 -o check.sav check.c
          ./gcc/dejagnu/uknc-run check.sav
          rm -f check.c check.sav check.sav.map

      # Linux gets no binaries. Anyone there builds this in an hour with
      # the script that is in it, and a binary linked against whatever
      # this runner happens to have is a liability on any other machine.
      # So what it packages is the repository at this commit -- and the
      # build above is what says the repository builds.
      - name: Package (the repository)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="uknc-${version}/" \
            -o "dist/${name}.tar.gz" HEAD

      - name: Package (dmg)
        if: runner.os == 'macOS'
        run: |
          cd dist
          hdiutil create -volname "UKNC ${version}" -srcfolder "${name}" \
            -ov -format UDZO "${name}.dmg"
          if [ "${SIGN_IDENTITY}" != "-" ]; then
            codesign -f -s "${SIGN_IDENTITY}" ${SIGN_FLAGS} "${name}.dmg"
          fi

      # Signing says who made the image; notarisation is Apple saying
      # it has seen it, and that is what Gatekeeper asks for on a
      # download.  The ticket is then stapled into the image, which
      # Apple recommends so that a mac with no network can still find
      # it.
      - name: Notarise (macOS)
        if: runner.os == 'macOS' && env.SIGN_IDENTITY != '-'
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          dmg="dist/${name}.dmg"

          # Apple's checks, before spending one of the day's
          # notarizations on an image that cannot pass: the signature
          # whole, and a secure timestamp in it.  "Timestamp=" means the
          # signature has one; "Signed Time=" means it does not, which
          # is what a signature made without the network looks like.
          hdiutil verify "${dmg}"
          codesign -vvv --deep --strict "${dmg}"
          if ! codesign -dvv "${dmg}" 2>&1 | grep -q "^Timestamp="; then
            echo "the image is signed without a secure timestamp," \
                 "which the notary service refuses" >&2
            codesign -dvv "${dmg}" 2>&1 | grep -E "^(Signed Time|Timestamp)=" >&2
            exit 1
          fi

          # A secret holds exactly what was pasted into it, and a value
          # copied out of a file arrives with the newline on the end.
          # None of these three can contain a space -- an Apple ID, an
          # app-specific password (xxxx-xxxx-xxxx-xxxx) and a team id --
          # so stripping whitespace cannot turn a right one into a wrong
          # one, and it does stop a stray newline looking like a wrong
          # password.
          trim () { printf '%s' "$1" | tr -d '[:space:]'; }

          key_used=no
          if [ -n "${NOTARY_KEY}" ]; then
            echo "${NOTARY_KEY}" | base64 --decode > "${RUNNER_TEMP}/notary.p8"
            key_used=yes
            set -- --key "${RUNNER_TEMP}/notary.p8" \
                   --key-id "$(trim "${NOTARY_KEY_ID}")"
            # Issuer is for team keys; notarytool says not to pass it
            # for an individual one, so an empty secret means absent
            # rather than empty.
            if [ -n "${NOTARY_ISSUER}" ]; then
              set -- "$@" --issuer "$(trim "${NOTARY_ISSUER}")"
            fi
          elif [ -n "${NOTARY_APPLE_ID}" ]; then
            set -- --apple-id "$(trim "${NOTARY_APPLE_ID}")" \
                   --password "$(trim "${NOTARY_PASSWORD}")" \
                   --team-id "$(trim "${NOTARY_TEAM_ID}")"
          else
            echo "signed, but no notary credentials: not notarised, so" \
                 "Gatekeeper will still stop a downloaded image" >&2
            exit 0
          fi

          # --wait, because an image published before the service has
          # answered is an image whose answer nobody will read; and the
          # machine-readable form, so that what is checked afterwards is
          # a field and not a line of prose that may be worded
          # differently tomorrow.  (notarytool says json suppresses the
          # progress indicator and prints one update at the end.)
          answer="${RUNNER_TEMP}/notary.json"
          xcrun notarytool submit "${dmg}" "$@" \
            --wait --timeout 30m --output-format json > "${answer}" || true
          cat "${answer}"

          # One line, because a block scalar ends at the first line
          # that is not indented into it -- and a json file that is not
          # one answers with nothing, which the check below reads as
          # "not accepted".
          field () {
            python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get(sys.argv[2],''))" \
              "${answer}" "$1" 2>/dev/null || true
          }
          id=$(field id)
          status=$(field status)

          # Apple: always read the log, even when it succeeded, because
          # it can hold warnings about what will stop working next.
          if [ -n "${id}" ]; then
            xcrun notarytool log "${id}" "$@" || true
          fi
          if [ "${key_used}" = yes ]; then
            rm -f "${RUNNER_TEMP}/notary.p8"
          fi

          if [ "${status}" != "Accepted" ]; then
            echo "the notary service answered \"${status}\" and not" \
                 "Accepted" >&2
            exit 1
          fi

          xcrun stapler staple "${dmg}"
          # What a user's mac will do with it, said out loud here.
          spctl --assess --type open \
            --context context:primary-signature -vv "${dmg}"

      - name: Package (installer)
        if: runner.os == 'Windows'
        run: |
          # Inno Setup packs a folder, offers a PATH entry and writes an
          # uninstaller, and needs no more than the script beside this
          # file. The runner image has it; if some later image does not,
          # it is one package away.
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "${iscc}" ]; then
            cmd.exe /c "choco install innosetup -y --no-progress"
          fi
          # MSYS2 rewrites an argument that looks like a POSIX path on
          # its way to a native program, and every /D here looks like
          # one: ISCC was handed three filenames and said so. This says
          # to leave them alone.
          export MSYS2_ARG_CONV_EXCL='*'
          "${iscc}" \
            "/DAppVersion=${version}" \
            "/DSourceDir=$(cygpath -w "${GITHUB_WORKSPACE}/dist/${name}")" \
            "/DOutputDir=$(cygpath -w "${GITHUB_WORKSPACE}/dist")" \
            "/DOutputName=${name}" \
            "$(cygpath -w "${GITHUB_WORKSPACE}/.github/installer/uknc.iss")"

      # Actions wraps every artifact in a zip of its own, and all three
      # of these are compressed already -- a .dmg twice over. Stored,
      # then, not deflated again for nothing. (A release asset is
      # attached as the file itself, with no zip anywhere.)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.exe
          compression-level: 0
          if-no-files-found: error

  # A tag, and only a tag, is a release: the packages, their checksums
  # and what each of them is for.  Nothing here rebuilds anything -- it
  # publishes what the jobs above made and checked.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the provenance attestations below: the first mints the
      # short-lived OIDC identity the claim is signed with, the second
      # persists the claim, and the third records it against the
      # artifact -- that last one is optional, and the action says so
      # and carries on without it.
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather what was built
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -l

      - name: Say what is in it
        run: |
          versions=$(grep -E '^(BINUTILS|GCC|NEWLIB)_VERSION=' \
            gcc/build_gcc_uknc.sh | tr -d '"' | tr '\n' ' ')
          {
            sed "s/@VERSION@/${GITHUB_REF_NAME#v}/g" .github/release-notes.md
            echo
            echo "Внутри: ${versions}"
            echo "Собрано из ${GITHUB_SHA}."
          } > notes.md
          cat notes.md

      # The signature everybody gets, with no Apple account in it: a
      # statement, signed on this workflow's own short-lived identity,
      # that these exact bytes came out of this run of this repository.
      # "gh attestation verify FILE --repo wdigger/uknc" checks it, and
      # the release notes say so.  It is not what Gatekeeper asks for --
      # that is the certificate and the notarisation above -- but it is
      # the thing a checksum in the same release cannot be: a checksum
      # published beside the file it describes proves nothing about
      # where either came from.
      - name: Attest what is being published
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "УКНЦ ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
